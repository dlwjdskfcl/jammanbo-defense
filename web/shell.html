<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>$GODOT_PROJECT_NAME</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아르마니여름">
<meta name="format-detection" content="telephone=no">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;background:#1b1a2e;color:#f4ecd8;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%;outline:none;background:#1b1a2e}
#canvas:focus{outline:none}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);text-align:center;background:#1b1a2e;z-index:10}
.layer.hide{display:none}
#splash img{width:min(60vw,260px);image-rendering:pixelated}
#splash h1{margin:0;font-size:22px;letter-spacing:.5px}
#splash p{margin:0;font-size:14px;opacity:.75}
#bar{width:min(70vw,300px);height:10px;border:2px solid #f4ecd8;border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffb347;transition:width .15s}
#start{font:inherit;font-size:20px;font-weight:bold;color:#1b1a2e;background:#ffb347;border:0;border-radius:12px;padding:14px 36px;touch-action:manipulation}
#start[hidden]{display:none}
#note{font-size:12px;opacity:.6;max-width:320px;line-height:1.5}
#fail{color:#ff8a8a;font-size:15px;line-height:1.6;max-width:340px;white-space:pre-line}
#rotate{z-index:30;display:none;font-size:18px;background:rgba(27,26,46,.96)}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){#rotate{display:flex}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:40;
  background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:88vw;display:none;text-align:center}
#toast button{font:inherit;margin-left:10px;border:0;border-radius:6px;padding:4px 10px;background:#ffb347;color:#1b1a2e}
#dbg{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;z-index:50;background:rgba(0,0,0,.82);color:#9fffa0;
  font:11px/1.35 monospace;padding:4px 6px;display:none;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#dbg .e{color:#ff8a8a}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">이 브라우저는 게임을 실행할 수 없어요. (HTML5 canvas 미지원)</canvas>

<div id="splash" class="layer">
  <img src="index.512x512.png" alt="">
  <h1>아르마니여름 랜덤 디펜스</h1>
  <p id="msg">게임을 내려받는 중… 처음 한 번만 오래 걸려요</p>
  <div id="bar"><i></i></div>
  <button id="start" hidden>터치해서 시작</button>
  <div id="note"></div>
  <div id="fail"></div>
</div>
<div id="rotate" class="layer">📱 폰을 세로로 돌려 주세요</div>
<div id="toast"></div>
<pre id="dbg"></pre>

<script src="$GODOT_URL"></script>
<script>
(function () {
'use strict';
var BUILD = '__BUILD__', BUILD_DATE = '__DATE__';
var $ = function (id) { return document.getElementById(id); };
var debug = /[?&]debug=1/.test(location.search);
var logEl = $('dbg'), logBuf = [];
console.info('[아르마니여름] build ' + BUILD + ' (' + BUILD_DATE + ')');
window.GAME_BUILD = { build: BUILD, date: BUILD_DATE };

function log(msg, isErr) {
  logBuf.push((isErr ? '! ' : '') + msg);
  if (logBuf.length > 80) logBuf.shift();
  if (debug) {
    logEl.style.display = 'block';
    logEl.innerHTML = '';
    logBuf.forEach(function (l) {
      var d = document.createElement('div'); if (l[0] === '!') d.className = 'e';
      d.textContent = l; logEl.appendChild(d);
    });
    logEl.scrollTop = logEl.scrollHeight;
  }
}
if (debug) log('build ' + BUILD + ' ' + BUILD_DATE + ' / ' + navigator.userAgent);
window.addEventListener('error', function (e) { log('JS 오류: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno, true); });
window.addEventListener('unhandledrejection', function (e) { log('Promise 오류: ' + (e.reason && e.reason.message || e.reason), true); });
if (debug) {
  var frames = 0, last = performance.now();
  (function tick(t) { frames++; if (t - last >= 2000) { log('FPS ' + Math.round(frames * 1000 / (t - last))); frames = 0; last = t; } requestAnimationFrame(tick); })(last);
}

var toastTimer;
function toast(text, html) {
  var t = $('toast'); if (html) { t.innerHTML = ''; t.appendChild(html); } else t.textContent = text;
  t.style.display = 'block'; clearTimeout(toastTimer);
  if (!html) toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2500);
}
function fail(text) {
  $('splash').classList.remove('hide'); $('bar').style.display = 'none'; $('start').hidden = true;
  $('msg').textContent = ''; $('fail').textContent = text; log(text, true);
}

// 핀치 줌 · 더블탭 확대 · 길게 눌러 메뉴 방지
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// 저장(IndexedDB) 가능 여부 — 시크릿 모드 등에서 진행이 저장되지 않을 수 있음
try {
  var req = indexedDB.open('__armani_probe__');
  req.onerror = function () { $('note').textContent = '⚠ 이 브라우저는 저장이 막혀 있어요(시크릿 모드?). 진행 상황이 저장되지 않을 수 있어요.'; log('IndexedDB 불가', true); };
  req.onsuccess = function () { req.result.close(); try { indexedDB.deleteDatabase('__armani_probe__'); } catch (e) {} };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
} catch (e) { $('note').textContent = '⚠ 저장 기능을 쓸 수 없어요. 진행 상황이 저장되지 않을 수 있어요.'; }

// ---------------------------------------------------------------------------------------------------------------
// 잠만보 연동 (window.JMBDEF) — 설계: 설정집/잠만보_연동_설계.md §5. 게임(Godot) 쪽은 scripts/jmb_link.gd(JmbLink) 만 이 객체를 부름.
//  · 잠만보와 같은 출처(dlwjdskfcl.github.io)라 잠만보 로그인 저장소를 읽을 수 있음. 카카오 30일 토큰은 이 안에서만 읽고 Godot 로 넘기지 않음
//    → 서버(defenseTicket)에서 '디펜스 전용 입장권(2시간)'으로 바꿔 쓰고, 입장권도 sessionStorage 에만 둠. 카카오 ID·프로필은 어디로도 안 감
//  · 요청은 text/plain 으로 보냄(CORS '단순 요청' — Apps Script 는 사전 확인 요청에 답하지 않음)
//  · 비동기 결과는 out[id] 에 쌓아 두고 Godot 가 take(id) 로 가져감. 로그인 안 했거나 서버가 안 되면 조용히 게스트 — 게임은 항상 정상 동작
//  · 환경: 주소에 ?env=beta 가 있으면 잠만보 '테스트' 배포(+ 키 접미사 _beta), 없으면 운영. GAS 주소는 잠만보 config.js 에 이미 공개된 값
// ---------------------------------------------------------------------------------------------------------------
var JMBDEF = window.JMBDEF = (function () {
  var ENV = /[?&]env=beta(&|#|$)/.test(location.search) ? 'beta' : 'prod', SFX = ENV === 'beta' ? '_beta' : '';
  var API = ENV === 'beta'
    ? 'https://script.google.com/macros/s/AKfycbwbDyYxw__R89IxnfekTwERd5xKK5y54h_6YcVNBYZLdg6K1U4n98hdoBh7OiIVUBia/exec'
    : 'https://script.google.com/macros/s/AKfycbwvE4TAy7rTGJe2FPIHh-norBPsZ_7oY5Cb8tQKEd53hDhXaUIVF4MGPL6Tb4pdEFFN/exec';
  var K_TICKET = 'jmbdef_ticket' + SFX, K_PENDING = 'jmbdef_pending' + SFX, K_VISIT = 'jmbdef_visit_at' + SFX, K_RANK = 'jmbdef_rank_';
  var PENDING_MAX = 5, NONCE_MS = 3 * 3600 * 1000;   // 서버는 시작 후 3시간 안에만 기록을 받음
  var ticket = null, tkP = null, run = null, out = {};

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function jget(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function kakaoToken() { var s = jget(lsGet('jmb_kakao_v2' + SFX)); return s && typeof s.token === 'string' ? s.token : ''; }
  function err(msg, flag) { var e = new Error(msg); if (flag) e[flag] = true; return e; }

  // 서버 호출: 네트워크·응답 형식 문제는 e.net, 서버가 거절한 것은 e.server
  function post(fn, args) {
    var ctl = window.AbortController ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctl ? ctl.signal : undefined,
        body: JSON.stringify({ fn: fn, args: args, env: ENV }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(timer); return j; }, function () { clearTimeout(timer); throw err('network', 'net'); })
      .then(function (j) { if (!j || j.ok !== true) throw err((j && j.e) || '오류', 'server'); return j.r; });
  }

  // 입장권: 있으면 재사용, 없거나 곧 만료면 로그인 토큰으로 교환 (로그인 안 했으면 guest 로 거절)
  var cached = jget(ssGet(K_TICKET));
  if (cached && cached.t && cached.exp > Date.now() + 300000) ticket = cached;
  function getTicket() {
    if (ticket && ticket.exp > Date.now() + 120000) return Promise.resolve(ticket);
    if (tkP) return tkP;
    var tok = kakaoToken();
    if (!tok) return Promise.reject(err('guest', 'guest'));
    tkP = post('defenseTicket', [tok]).then(function (r) {
      ticket = { t: r.ticket, nick: r.nick, exp: r.exp }; ssSet(K_TICKET, JSON.stringify(ticket)); tkP = null; return ticket;
    }, function (e) { tkP = null; throw e; });
    return tkP;
  }
  // 입장권이 필요한 호출. 서버가 expired 라고 하면 입장권을 새로 받아 한 번만 다시
  function withTicket(fn) {
    return getTicket().then(fn).catch(function (e) {
      if (e && e.server && e.message === 'expired') { ticket = null; ssSet(K_TICKET, null); return getTicket().then(fn); }
      throw e;
    });
  }

  // 재시도 대기열 (네트워크 실패로 못 보낸 판 결과) — 다음 로비 진입 때 flush
  function queue() { var q = jget(lsGet(K_PENDING)); return Array.isArray(q) ? q : []; }
  function saveQueue(q) { lsSet(K_PENDING, JSON.stringify(q.slice(-PENDING_MAX))); }
  function enqueue(item) { var q = queue(); q.push(item); saveQueue(q); }
  function sendItem(item) { return withTicket(function (t) { return post('defenseSubmit', [t.t, item.nonce, item.result]); }); }
  function flush() {
    var q = queue().filter(function (it) { return it && it.nonce && Date.now() - it.at < NONCE_MS; }), sent = 0;
    saveQueue(q);
    function next() {
      if (!q.length) return Promise.resolve({ sent: sent, left: 0 });
      return sendItem(q[0]).then(function () { q.shift(); sent++; saveQueue(q); return next(); }, function (e) {
        if (e && (e.net || e.guest)) return { sent: sent, left: q.length };   // 아직 연결 안 됨 · 로그아웃 상태 → 그대로 두고 다음에
        q.shift(); saveQueue(q); return next();                                // 서버가 거절한 건 다시 보내도 같음 → 버림
      });
    }
    return next();
  }

  function deviceId() {   // 잠만보 화면·티츄와 같은 기기 구분 값 (개인 정보 아님) — 접속기록의 '추정닉네임'이 같은 기기로 이어짐
    var id = lsGet('jmb_vid');
    if (!id) { id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); lsSet('jmb_vid', id); }
    return id;
  }
  function visit() {   // 접속 기록: 기기마다 30분에 한 번 (서버도 25분 중복 거름)
    if (Date.now() - (+lsGet(K_VISIT) || 0) < 30 * 60e3) return Promise.resolve({ skip: 1 });
    lsSet(K_VISIT, String(Date.now()));
    var info = { cid: deviceId(), ua: navigator.userAgent, w: screen.width, h: screen.height, touch: navigator.maxTouchPoints || 0,
      app: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone ? 1 : 0 };
    var uad = navigator.userAgentData;
    if (uad) info.mobile = !!uad.mobile;
    var model = uad && uad.getHighEntropyValues ? uad.getHighEntropyValues(['model']).then(function (h) { info.model = h.model || ''; }, function () {}) : Promise.resolve();
    return model.then(function () { return getTicket().then(function (t) { return t.t; }, function () { return ''; }); })
      .then(function (tk) { return post('defenseVisit', [tk, info]); });
  }

  var OPS = {
    // 로그인 확인 → {nick}. 로그인 안 했으면 nick '' (게스트). 닉네임 미연결 등 서버 문구는 msg 로
    login: function () {
      return getTicket().then(function (t) { return { nick: t.nick }; }, function (e) {
        if (e && e.guest) return { nick: '' };
        throw e;
      });
    },
    rank: function (a) {
      var scope = a.scope === 'week' || a.scope === 'season' ? a.scope : 'all';
      return getTicket().then(function () { return withTicket(function (t) { return post('defenseInfo', [t.t, scope]); }); }, function (e) {
        if (e && e.guest) return { guest: true, scope: scope, mine: null, top: [] };
        throw e;
      }).then(function (r) { if (r && !r.guest) lsSet(K_RANK + scope + SFX, JSON.stringify(r)); return r; });
    },
    // 판 시작: 확인값(nonce)은 여기 보관(Godot 로 안 줌). 기다리지 않고 판은 바로 시작됨
    start: function (a) {
      var meta = { ver: BUILD, dungeon: a.dungeon > 0 ? a.dungeon : 1 };
      var p = withTicket(function (t) { return post('defenseStart', [t.t, meta]); }).then(function (r) { return r.nonce; });
      run = { p: p, at: Date.now() };
      p.catch(function () {});
      return p.then(function () { return {}; });
    },
    // 판 결과: 시작 확인값이 없으면(게스트·서버 오류) 기록 안 함. 네트워크 실패면 대기열에 넣고 나중에 다시
    submit: function (a) {
      var r = run; run = null;
      if (!r) return Promise.resolve({ skipped: 1 });
      return r.p.then(function (nonce) {
        var item = { nonce: nonce, at: r.at, result: a.result };
        return sendItem(item).catch(function (e) { if (e && e.net) { enqueue(item); return { queued: 1 }; } throw e; });
      }, function () { return { skipped: 1 }; });
    },
    flush: flush,
    visit: visit
  };

  // Godot → call(id, op, JSON 인자 글자) 로 시작, take(id) 로 결과 가져감 ('wait' 이면 아직)
  function call(id, op, argsJson) {
    out[id] = { state: 'wait' };
    var done = function (v) { out[id] = v; };
    try {
      var a = argsJson ? JSON.parse(argsJson) : {};
      Promise.resolve(OPS[op](a || {})).then(function (d) { done({ state: 'ok', data: d == null ? {} : d }); },
        function (e) { done({ state: 'err', msg: String(e && e.message || e), net: !!(e && e.net) }); });
    } catch (e) { done({ state: 'err', msg: String(e && e.message || e) }); }
  }
  function take(id) { var v = out[id]; if (v && v.state !== 'wait') delete out[id]; return JSON.stringify(v || null); }
  function cachedRank(scope) { return lsGet(K_RANK + (scope === 'week' || scope === 'season' ? scope : 'all') + SFX) || 'null'; }   // 마지막으로 받은 랭킹(먼저 보여 주기용)

  return { env: ENV, call: call, take: take, cachedRank: cachedRank };
})();

var GODOT_CONFIG = $GODOT_CONFIG;
var engine = new Engine(GODOT_CONFIG);

var missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  fail('이 브라우저에서는 실행할 수 없어요.\n최신 Chrome / Safari / Edge 로 열어 주세요.\n(부족한 기능: ' + missing.join(', ') + ')');
  return;
}

var wake = null;
function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function (l) { wake = l; l.addEventListener('release', function () { wake = null; }); }).catch(function () {});
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !wake && started) keepAwake(); });

// 뒤로가기: 실수로 게임을 나가지 않게 한 번 막고, 2초 안에 한 번 더 누르면 나감
var started = false, lastBack = 0;
function armBack() { try { history.pushState({ g: 1 }, ''); } catch (e) {} }
window.addEventListener('popstate', function () {
  if (!started) return;
  var now = Date.now();
  if (now - lastBack < 2000) { history.back(); return; }
  lastBack = now; armBack(); toast('한 번 더 누르면 나가요');
});

function onProgress(cur, total) {
  var p = total > 0 ? Math.min(100, Math.round(cur / total * 100)) : 0;
  $('bar').firstElementChild.style.width = p + '%';
  if (total > 0) $('msg').textContent = '게임을 내려받는 중… ' + p + '% (' + (cur / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB)';
}

// 1단계: 엔진(.wasm)+게임 데이터(.pck) 내려받기 → 2단계: '터치해서 시작'(소리·전체화면·화면 유지는 터치 뒤에만 허용) → 게임 시작
GODOT_CONFIG.onProgress = onProgress;
var PACK = GODOT_CONFIG.executable + '.pck';
Promise.all([engine.init(GODOT_CONFIG.executable), engine.preloadFile(PACK, PACK)]).then(function () {
  $('bar').firstElementChild.style.width = '100%';
  $('msg').textContent = '준비 완료!';
  var b = $('start'); b.hidden = false;
  return new Promise(function (res) { b.addEventListener('click', function () { b.hidden = true; res(); }, { once: true }); });
}).then(function () {
  $('msg').textContent = '게임을 여는 중…';
  keepAwake();
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
  started = true; armBack();
  return engine.start({
    args: ['--main-pack', PACK],
    onPrint: function () { var a = Array.prototype.slice.call(arguments).join(' '); console.log(a); if (debug) log(a); },
    onPrintError: function () { var a = Array.prototype.slice.call(arguments).join(' '); console.error(a); log(a, true); }
  });
}).then(function () {
  $('splash').classList.add('hide');
  $('canvas').focus();
  engine.installServiceWorker().then(watchUpdate).catch(function (e) { log('서비스 워커: ' + e, true); });
}).catch(function (err) {
  fail('게임을 시작하지 못했어요.\n새로고침 해 보세요. 계속 안 되면 주소 끝에 ?debug=1 을 붙여 오류를 확인하세요.\n\n' + (err && err.message || err));
});

// 새 버전 알림: 새 서비스 워커가 설치되면(= 새로 배포됨) '업데이트' 버튼을 보여 줌. 눌러야만 바뀜(플레이 중 갑자기 새로고침 금지)
function watchUpdate(reg) {
  if (!reg) return;
  function offer(w) {
    var s = document.createElement('span'); s.textContent = '새 버전이 있어요 ';
    var b = document.createElement('button'); b.textContent = '업데이트';
    b.onclick = function () { try { w.postMessage('update'); } catch (e) { location.reload(); } };
    s.appendChild(b); toast('', s);
  }
  if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
  reg.addEventListener('updatefound', function () {
    var w = reg.installing; if (!w) return;
    w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
  });
  setInterval(function () { reg.update().catch(function () {}); }, 10 * 60 * 1000);
}
})();
</script>
